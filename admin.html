<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ADMIN — Mamthethwa</title><link rel="stylesheet" href="style/style.css"></head>
<body>
<header><div class="logo">ADMIN <span>MAMTHETHWA</span></div><div class="header-right"><a href="index.html" class="admin-pill">SHOP</a><button class="admin-pill" onclick="adminLogout()">LOGOUT</button></div></header>

<div id="loginBox" class="login-box">
  <h3>MAMTHETHWA ADMIN</h3><p class="small"></p>
  <label>Username</label><input id="lUser"><label>Password</label><input id="lPass" type="password"><p id="lError" class="error"></p>
  <button class="btn-pink full" onclick="adminLogin()">Login ♡</button>
</div>

<div id="adminPanel" class="hidden">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('add',this)">+ Add Stock</button>
    <button class="tab" onclick="switchTab('products',this)">Products</button>
    <button class="tab" onclick="switchTab('orders',this)">Orders Table</button>
  </div>
  <div class="admin-wrap">
    <div id="tab-add" class="admin-card">
      <h3>Add Stock — 5 Pictures ♡</h3>
      <label>Name *</label><input id="aName" placeholder="Combo Brown">
      <label>Category *</label><select id="aCat"><option>Combo</option><option>T-shirt</option><option>Pants</option><option>Shoes</option></select>
      <label>Price R *</label><input id="aPrice" type="number" placeholder="950">
      <label>Sizes Stock e.g. S:5,M:10,L:3 or 3:5,4:10 *</label><input id="aSizes" placeholder="S:5,M:10,L:8">
      <label>Upload 5 Pictures from Device</label>
      <div class="upload-grid">
        <label class="upload-box"><input type="file" accept="image/*" hidden onchange="handleImg(this,0)"><span id="up0">+ Pic 1 *</span><img id="prev0" class="prev"></label>
        <label class="upload-box"><input type="file" accept="image/*" hidden onchange="handleImg(this,1)"><span id="up1">+ Pic 2</span><img id="prev1" class="prev"></label>
        <label class="upload-box"><input type="file" accept="image/*" hidden onchange="handleImg(this,2)"><span id="up2">+ Pic 3</span><img id="prev2" class="prev"></label>
        <label class="upload-box"><input type="file" accept="image/*" hidden onchange="handleImg(this,3)"><span id="up3">+ Pic 4</span><img id="prev3" class="prev"></label>
        <label class="upload-box"><input type="file" accept="image/*" hidden onchange="handleImg(this,4)"><span id="up4">+ Pic 5</span><img id="prev4" class="prev"></label>
      </div>
      <button class="btn-pink full" onclick="addProduct()">Publish Product ♡</button>
    </div>
    <div id="tab-products" class="admin-card hidden"><div id="adminProducts"></div></div>
    <div id="tab-orders" class="admin-card hidden"><div style="overflow:auto"><table class="order-table"><thead><tr><th>MT Code</th><th>Name</th><th>Phone</th><th>Address</th><th>Items</th><th>Total</th><th>Status</th><th>Est Days</th><th>Date</th><th>X</th></tr></thead><tbody id="adminOrders"></tbody></table></div></div>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
